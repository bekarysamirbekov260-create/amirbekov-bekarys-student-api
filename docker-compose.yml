services:
  db:
    image: postgres:16
    container_name: bekarys-student-db
    environment:
      POSTGRES_DB: students
      POSTGRES_USER: student
      POSTGRES_PASSWORD: ${DB_PASSWORD:-student123}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U student -d students"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: bekarys-student-api
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/students
      SPRING_DATASOURCE_USERNAME: student
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-student123}
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
